name: Build and Deploy to FC

on:
  push:
    branches: [main]

env:
  REGISTRY: crpi-9kg6vtzvh3awqysx.cn-hongkong.personal.cr.aliyuncs.com
  REGISTRY_VPC: crpi-9kg6vtzvh3awqysx-vpc.cn-hongkong.personal.cr.aliyuncs.com
  NAMESPACE: apps
  IMAGE_NAME: audio-wiki-api
  FC_REGION: cn-hongkong
  FC_FUNCTION: audio-wiki-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送镜像
        run: |
          IMAGE=$REGISTRY/$NAMESPACE/$IMAGE_NAME
          docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      - name: 安装阿里云 CLI
        run: |
          curl -sSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli.tgz
          tar xzf aliyun-cli.tgz
          sudo mv aliyun /usr/local/bin/aliyun

      - name: 更新 FC 函数镜像
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          aliyun configure set \
            --access-key-id "$ALIYUN_ACCESS_KEY_ID" \
            --access-key-secret "$ALIYUN_ACCESS_KEY_SECRET" \
            --region $FC_REGION

          IMAGE_VPC=$REGISTRY_VPC/$NAMESPACE/$IMAGE_NAME:${{ github.sha }}
          aliyun fc UpdateFunction \
            --region $FC_REGION \
            --functionName $FC_FUNCTION \
            --body "{\"customContainerConfig\":{\"image\":\"$IMAGE_VPC\"}}"

          echo "✅ FC 已更新到镜像: $IMAGE_VPC"
